 if(a==='credit'){S.cash-=S.credit;S.credit=0;mentor('סגרת את חוב האשראי. זה החוב הכי יקר שיש — כל הכבוד.')}
 render();save()};
$('#sheetBtn').onclick=()=>$('#sheet').classList.toggle('open');

function card({tag,color,title,html='',actions,onExtra}){const c=$('#card');
 c.innerHTML=`<span class="tag" style="--c:${color}">${tag}</span><h2>${title}</h2>${html}<div class="acts">${actions.map((a,i)=>`<button data-i="${i}" class="${a.cls||''}" ${a.dis?'disabled':''}>${a.label}</button>`).join('')}</div>`;
 $('#modal').hidden=false;setTimeout(()=>c.querySelector('.acts button:not(:disabled)')?.focus(),50);
 return new Promise(res=>{c.onclick=e=>{const b=e.target.closest('button[data-i]');if(!b){onExtra&&onExtra(e);return}const a=actions[+b.dataset.i];if(a.fn&&a.fn()===false)return;$('#modal').hidden=true;res(a.v)}})}

function ensureCash(){if(S.cash>=0)return;const need=Math.ceil(-S.cash/5000)*5000;S.loans+=need;S.cash+=need;S.stats.autoLoan+=need;
 toast('הבנק נתן לך הלוואה של '+fmt(need));mentor('נגמר לך המזומן, אז הבנק לקח החלטה בשבילך: הלוואה של '+fmt(need)+'. ככה נראית חיים בלי קרן חירום.')}

function payday(landed){const cf=cashflow();S.cash+=cf;S.month++;ensureCash();label(sgn(cf),cf>=0?'#178a55':'#d23b30',pawn.position.clone().add(new THREE.Vector3(0,2.4,0)));toast('יום משכורת: '+sgn(cf));render();return cf}

/* ---------------- TILES ---------------- */
async function onPayday(){const cf=payday(true),pas=passive(),ex=expTotal();
 mentor(pas===0?'כל הכסף שלך מגיע מהעבודה. אם תפסיק לעבוד — הוא נעצר. המטרה: נכסים שעובדים בשבילך.':`הנכסים שלך מכסים ${Math.round(pas/ex*100)}% מההוצאות. תמשיך ככה.`);
 await card({tag:'יום משכורת',color:'#c98a12',title:'קיבלת משכורת',html:`<div class="grid"><div class="row"><span>משכורת</span><span class="pos">${sgn(S.salary)}</span></div><div class="row"><span>הכנסה פסיבית</span><span class="pos">${sgn(pas)}</span></div><div class="row"><span>הוצאות</span><span class="neg">−${fmt(ex)}</span></div><div class="row"><b>נכנס לכיס</b><b class="${cls(cf)}">${sgn(cf)}</b></div></div>`,actions:[{label:'המשך',cls:'primary'}]})}

function drawDeal(){if(!S.deck.length){const d=DEALS.map((_,i)=>i);for(let i=d.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[d[i],d[j]]=[d[j],d[i]]}S.deck=d}return DEALS[S.deck.pop()]}

async function onDeal(){const d=drawDeal();if(d.k==='stock'||d.k==='crypto'){S.prices[d.tk]=d.p;return trade(d.tk,d.n,d.d,'הזדמנות','#1f9d63')}
 const loan=d.cost-d.down,roi=d.down?d.cf*12/d.down*100:0,short=Math.max(0,d.down-S.cash),loanNeed=Math.ceil(short/5000)*5000;
 mentor(d.q||'לפני שאתה מחליט: כמה כסף אתה שם, וכמה זה מחזיר לך כל חודש? נסה לחשב את התשואה לבד.');
 const v=await card({tag:'הזדמנות · '+(d.k==='re'?'נדל"ן':'עסק'),color:'#1f9d63',title:d.n,html:`<p class="d">${d.d}</p>
  <div class="grid"><div class="row"><span>מחיר</span><span>${fmt(d.cost)}</span></div><div class="row"><span>הון עצמי (משלמים עכשיו)</span><b>${fmt(d.down)}</b></div>
  <div class="row"><span>${d.k==='re'?'משכנתא':'הלוואה'} (חוב)</span><span>${fmt(loan)}</span></div><div class="row"><span>תזרים חודשי נטו</span><b class="big ${cls(d.cf)}">${sgn(d.cf)}</b></div></div>
  <button class="chip" data-roi>תראה לי את החישוב</button><div class="roi" id="roiBox" hidden>תשואה על ההון = תזרים שנתי ÷ הון עצמי<br>${fmt(d.cf)} × 12 ÷ ${fmt(d.down)} = <b class="${cls(roi)}">${Math.round(roi)}% בשנה</b><br><span class="note">התזרים כבר כולל את תשלומי ה${d.k==='re'?'משכנתא':'הלוואה'}.</span></div>
  <p class="note">יש לך ${fmt(S.cash)} במזומן.${short?` חסרים ${fmt(short)}.`:''}</p>`,
  onExtra:e=>{if(e.target.closest('[data-roi]'))$('#roiBox').hidden=false},
  actions:[short?{label:`הלוואה ${fmt(loanNeed)} וקנייה`,v:'loanbuy'}:{label:'לקנות ב־'+fmt(d.down),cls:'primary',v:'buy'},{label:'לוותר',v:'pass'}]});
 if(v==='pass'){mentor(d.cf<0?'החלטה חכמה. נכס שמוציא לך כסף כל חודש הוא בעצם התחייבות.':d.cf===0?'נכון. בלי תזרים זה הימור, לא נכס.':'ויתרת. לפעמים זה נכון — רק תוודא שזה בגלל המספרים, לא בגלל פחד.');return}
 if(v==='loanbuy'){S.loans+=loanNeed;S.cash+=loanNeed}
 S.cash-=d.down;const a={id:S.nextId++,k:d.k,n:d.n,cost:d.cost,down:d.down,cf:d.cf};S.assets.push(a);S.stats.deals++;if(d.cf<0)S.stats.bad++;
 a.m=spawn(MODEL_FOR[d.k],sgn(d.cf)+' לחודש',d.cf>=0?'#178a55':'#d23b30');
 if(d.cf>0)mentor(`זה נכס: ${fmt(d.cf)} נכנסים לך כל חודש בלי לעבוד. תשואה של ${Math.round(roi)}% בשנה על הכסף ששמת.${v==='loanbuy'?' ושים לב: גם ההלוואה עולה ₪'+(loanNeed*0.1).toLocaleString('he-IL')+' בחודש.':''}`);
 else if(d.cf<0)mentor('קנית משהו שמוציא לך כסף כל חודש. בעולם האמיתי קוראים לזה "השקעה". אבא עשיר קורא לזה התחייבות.');
 else mentor('קנית משהו שלא מכניס כלום. אולי יום אחד הוא יהיה שווה הרבה — אבל עד אז, הוא לא עוזר לך לצאת מהמירוץ.');
 render()}

async function trade(tk,title,desc,tag,color){const T=TICK[tk],p=S.prices[tk];let q=0;
 mentor(tk==='BANK'?'מניית דיבידנד: כל מניה מכניסה ₪0.15 בחודש. זה נכס אמיתי — קטן, אבל יציב.':tk==='TCHN'?'מניה בלי דיבידנד לא מכניסה כלום כל חודש. מרוויחים רק אם מוכרים ביותר ממה שקנית.':'מטבע בלי שום עסק מאחוריו. יכול לעשות פי 10 ויכול להתאפס. רק כסף שאתה מוכן להפסיד.');
 const upd=()=>{$('#qv').value=q.toLocaleString('he-IL');$('#qinfo').textContent=q?`עסקה של ${fmt(q*p)}`:'בחר כמות';$('#qerr').textContent=''};
 const maxBuy=()=>Math.floor(S.cash/p);
 const v=await card({tag,color,title,html:`<p class="d">${desc}</p><div class="grid"><div class="row"><span>${T.n}</span><b class="big">${fmtP(p)}</b></div><div class="row"><span>יש לך</span><span>${S.shares[tk].toLocaleString('he-IL')} מניות · ${fmt(S.shares[tk]*p)}</span></div>${T.div?`<div class="row"><span>דיבידנד חודשי למניה</span><span class="pos">${fmtP(T.div)}</span></div>`:''}</div>
  <div class="qty"><button data-q="${-T.step[1]}">−${T.step[1]}</button><button data-q="${-T.step[0]}">−${T.step[0]}</button><output id="qv">0</output><button data-q="${T.step[0]}">+${T.step[0]}</button><button data-q="${T.step[1]}">+${T.step[1]}</button></div>
  <div class="qty"><button class="chip" data-q="max">מקסימום לקנייה (${maxBuy().toLocaleString('he-IL')})</button>${S.shares[tk]?`<button class="chip" data-q="all">כל המניות שלי</button>`:''}</div>
  <p class="note" id="qinfo" style="text-align:center">בחר כמות</p><p class="err" id="qerr"></p>`,
  onExtra:e=>{const b=e.target.closest('[data-q]');if(!b)return;const s=b.dataset.q;q=s==='max'?maxBuy():s==='all'?S.shares[tk]:Math.max(0,q+ +s);upd()},
  actions:[{label:'לקנות',cls:'primary',v:'buy',fn:()=>{if(!q||q*p>S.cash){$('#qerr').textContent=q?'אין מספיק מזומן':'בחר כמות';return false}}},
   {label:'למכור',v:'sell',dis:!S.shares[tk],fn:()=>{if(!q||q>S.shares[tk]){$('#qerr').textContent=q?'אין לך כל כך הרבה מניות':'בחר כמות';return false}}},{label:'לא עכשיו',v:'no'}]});
 if(v==='buy'){S.cash-=q*p;S.shares[tk]+=q;S.basis=S.basis||{};S.basis[tk]=(S.basis[tk]||0)+q*p;syncMarketModels();
  mentor(tk==='BANK'?`קנית ${q.toLocaleString('he-IL')} מניות. הן יכניסו ${fmt(q*T.div)} כל חודש.`:'קנית. עכשיו זה משחק של סבלנות ומזל — אין פה תזרים, רק מחיר.')}
 if(v==='sell'){const avg=(S.basis?.[tk]||0)/(S.shares[tk]||1),gain=(p-avg)*q;S.cash+=q*p;S.basis[tk]=Math.max(0,(S.basis?.[tk]||0)-avg*q);S.shares[tk]-=q;syncMarketModels();
  label(sgn(gain),gain>=0?'#178a55':'#d23b30',pawn.position.clone().add(new THREE.Vector3(0,2.4,0)));
  mentor(gain>=0?`רווח של ${fmt(gain)}. עכשיו השאלה החשובה: איזה נכס תקנה עם הכסף הזה?`:`הפסד של ${fmt(-gain)}. קורה. השאלה אם מכרת בגלל המספרים או בגלל הפחד.`)}
 render()}

async function onDoodad(){const d=rnd(DOODADS),pay=Math.round(d.a*0.05);mentor(d.q);
 const v=await card({tag:'הוצאה מפתה',color:'#e2483d',title:d.n,html:`<div class="grid"><div class="row"><span>מחיר</span><b class="big neg">${fmt(d.a)}</b></div></div><p class="note">אין ברירה — זה כבר קרה. יש לך ${fmt(S.cash)}.</p>`,
  actions:[{label:'לשלם '+fmt(d.a),cls:'primary',v:'cash'},...(d.inst?[{label:`בתשלומים (${fmt(pay)} בחודש)`,v:'inst'}]:[])]});
 S.stats.doodad+=d.a;
 if(v==='inst'){S.credit+=d.a;mentor(`עכשיו יש לך חוב אשראי של ${fmt(d.a)} שעולה ${fmt(pay)} כל חודש — עד שתסגור אותו. ככה בונים את המירוץ בעצמנו.`)}
 else{S.cash-=d.a;ensureCash();if(S.cash>=0)mentor('כסף שיצא ולא יחזור. עשירים קונים קודם נכסים, ואת הצעצועים הם קונים מהתזרים שהנכסים מייצרים.')}

async function onLayoff(){const ex=expTotal();mentor(`אם היו לך 3–6 חודשי הוצאות בצד, זה היה סתם חודש רע. בלי קרן חירום — זה משבר.`);
 await card({tag:'פיטורים',color:'#3b3f4e',title:'פוטרת החודש',html:`<p class="d">החברה מצמצמת. החודש אין משכורת, אבל ההוצאות לא מחכות.</p><div class="grid"><div class="row"><span>הוצאות לחודש</span><b class="big neg">−${fmt(ex)}</b></div><div class="row"><span>ההכנסה הפסיבית שלך</span><span class="pos">${sgn(passive())}</span></div></div><p class="note">הנכסים ממשיכים לעבוד גם כשאתה לא.</p>`,actions:[{label:'לשלם ולהמשיך',cls:'primary'}]});
 S.cash+=passive()-ex;ensureCash();render()}

async function onMarket(){const m=rnd(MARKET);
 if(m.k==='price'){S.prices[m.tk]=m.p;return trade(m.tk,m.n,m.d,'שוק','#2f6fdb')}
 if(m.k==='sell'){const own=S.assets.filter(a=>a.k===m.type);
  mentor(own.length?'מכירה נותנת כסף פעם אחת, אבל מוותרת על הכנסה כל חודש. תמכור רק אם יש לך תוכנית לנכס גדול יותר.':'אין לך מה למכור הפעם. תזכור את זה כשתקנה — ככה מרוויחים פעמיים: תזרים ועליית ערך.');
  const rows=()=>own.filter(a=>S.assets.includes(a)).map(a=>{const offer=Math.round(a.cost*m.mult),net=offer-(a.cost-a.down);return`<div class="sellrow"><span>${a.n}<br><span class="note">הצעה ${fmt(offer)} · אחרי סגירת חוב: <b class="pos">${fmt(net)}</b> · מוותר על ${sgn(a.cf)} בחודש</span></span><button data-sell="${a.id}">למכור</button></div>`}).join('')||'<p class="empty">אין לך נכסים מהסוג הזה.</p>';
  await card({tag:'שוק',color:'#2f6fdb',title:m.n,html:`<p class="d">${m.d}</p><div id="sellList">${rows()}</div>`,
   onExtra:e=>{const b=e.target.closest('[data-sell]');if(!b)return;const a=S.assets.find(x=>x.id==b.dataset.sell);if(!a)return;const net=Math.round(a.cost*m.mult)-(a.cost-a.down);
    S.cash+=net;S.stats.sold++;S.assets=S.assets.filter(x=>x!==a);despawn(a.m);label('+'+fmt(net),'#178a55',pawn.position.clone().add(new THREE.Vector3(0,2.4,0)));render();$('#sellList').innerHTML=rows();
    mentor(`מכרת ברווח של ${fmt(net-a.down)} על ההון ששמת. עכשיו תחפש נכס עם תזרים גדול יותר.`)},
   actions:[{label:'סיום',cls:'primary'}]});return}
 let amt=0,html='';
 if(m.k==='repair'){const n=S.assets.filter(a=>a.k==='re').length;amt=-n*m.amt;html=n?`<div class="grid"><div class="row"><span>${n} דירות × ${fmt(m.amt)}</span><b class="big neg">${fmt(amt)}</b></div></div>`:'<p class="empty">אין לך דירות — הפעם זה לא נוגע אליך.</p>';
  mentor(n?'לנכסים יש גם הוצאות לא צפויות. בגלל זה לא קונים עם השקל האחרון.':'יום אחד יהיו לך דירות, ואז תזכור: תמיד להשאיר כרית לתיקונים.')}
 if(m.k==='bonus'){amt=S.assets.filter(a=>a.k==='biz').reduce((s,a)=>s+Math.max(0,a.cf),0);html=amt?`<div class="grid"><div class="row"><span>בונוס חד־פעמי</span><b class="big pos">${sgn(amt)}</b></div></div>`:'<p class="empty">אין לך עסקים — הבונוס הולך למישהו אחר.</p>';
  mentor(amt?'עסקים טובים מרוויחים יותר כשהשוק חם. ככה נראה נכס שעובד בשבילך.':'בעלי עסקים קיבלו עכשיו בונוס. העובדים שלהם — לא.')}
 if(m.k==='div'){amt=S.shares[m.tk]*m.amt;html=amt?`<div class="grid"><div class="row"><span>${S.shares[m.tk].toLocaleString('he-IL')} מניות × ${fmtP(m.amt)}</span><b class="big pos">${sgn(amt)}</b></div></div>`:'<p class="empty">אין לך מניות BANK.</p>';
  mentor(amt?'בעלי מניות מקבלים חלק מהרווחים. בלי לעבוד.':'מי שמחזיק מניות BANK קיבל עכשיו כסף בלי לעשות כלום.')}
 await card({tag:'שוק',color:'#2f6fdb',title:m.n,html:`<p class="d">${m.d}</p>${html}`,actions:[{label:'המשך',cls:'primary'}]});
 S.cash+=amt;ensureCash();render()}

const netWorth=()=>S.cash+S.assets.reduce((s,a)=>s+a.down,0)+Object.keys(S.shares).reduce((s,k)=>s+S.shares[k]*S.prices[k],0)-S.loans-S.credit;

function boardHtml(b,limit=10){if(!b||!b.length)return'<p class="empty">עוד אף אחד לא סיים. תהיה הראשון.</p>';let n=0;
 return`<ol class="lb">${b.slice(0,limit).map(r=>{const done=r.status!=='playing';if(done)n++;
  return`<li class="${r.me?'me':''}"><span class="rk">${done?n:'·'}</span><span class="nm">${esc(r.nickname)}${r.me?' (אתה)':''}</span><span class="rs">${r.status==='won'?`יצא בחודש ${r.months}`:r.status==='lost'?`${Math.round((r.passive||0)/Math.max(1,r.expenses||1)*100)}% מהדרך`:'משחק עכשיו'}</span></li>`}).join('')}</ol>`}
const daysLeft=d=>{const ms=new Date(d)-Date.now();if(ms<=0)return'נסגר';const h=Math.ceil(ms/36e5);return h<48?`נשארו ${h} שעות`:`נשארו ${Math.ceil(h/24)} ימים`};

/* ---------------- END OF GAME ---------------- */
async function finishGame(status){const st=S.stats,pas=passive(),ex=expTotal(),nw=netWorth();S.over=status;save();
 if(status==='won'){confetti();mentor('יצאת מהמירוץ. מעכשיו אתה עובד כי אתה רוצה, לא כי אתה צריך.')}
 else mentor(`עברו ${MAXM} חודשים והנכסים מכסים ${Math.round(pas/ex*100)}% מההוצאות. רוב האנשים נשארים במירוץ כל החיים — עכשיו אתה יודע למה.`);
 let board='';
 if(S.resultId){for(;;){try{await api('rr_finish',{...auth(),p_result:S.resultId,p_status:status,p_months:Math.min(S.month,200),p_passive:Math.round(pas),p_expenses:Math.round(ex),p_net_worth:Math.round(nw),p_stats:st});
    const b=S.mode==='weekly'?(await api('rr_weekly',auth())).board:((await api('rr_group',{...auth(),p_group:S.groupId})).challenges.find(c=>c.id===S.challengeId)||{}).board;
    const mine=(b||[]).filter(r=>r.status!=='playing').findIndex(r=>r.me);
    board=`<h3 style="margin:14px 0 0">${mine>=0?`המקום שלך: ${mine+1}`:'הטבלה'}</h3>${boardHtml(b,10)}`;break}
   catch(e){if(/כבר סיימת/.test(e.message))break;const v=await card({tag:'שגיאה',color:'#d23b30',title:'התוצאה לא נשמרה',html:`<p class="d">${esc(e.message)}</p>`,actions:[{label:'לנסות שוב',cls:'primary',v:'retry'},{label:'לוותר',v:'skip'}]});if(v==='skip')break}}}
 await card({tag:status==='won'?'ניצחון':'נגמר הזמן',color:status==='won'?'#c98a12':'#3b3f4e',title:status==='won'?'יצאת ממירוץ העכברים!':'נשארת במירוץ',
  html:`<p class="d">${status==='won'?`ההכנסה הפסיבית שלך (${fmt(pas)}) עברה את ההוצאות (${fmt(ex)}).`:`הכנסה פסיבית ${fmt(pas)} מול הוצאות ${fmt(ex)}.`}</p>
  <div class="grid"><div class="row"><span>חודשים</span><b>${S.month}</b></div><div class="row"><span>שווי נקי</span><span>${fmt(nw)}</span></div><div class="row"><span>עסקאות שקנית</span><span>${st.deals}</span></div><div class="row"><span>"נכסים" שהוציאו כסף</span><span class="${st.bad?'neg':''}">${st.bad}</span></div><div class="row"><span>הוצאות מפתות</span><span>${fmt(st.doodad)}</span></div><div class="row"><span>הלוואות חירום</span><span>${fmt(st.autoLoan)}</span></div></div>
  <p class="note">${st.bad?'בפעם הבאה: תבדוק את התזרים לפני שאתה מתאהב בנכס.':st.doodad>8000?'בפעם הבאה: פחות צעצועים מהמשכורת = יציאה מהירה יותר.':status==='won'?'משחק נקי. נסה מקצוע אחר וראה כמה זה משנה.':'בפעם הבאה: תחפש נכסים עם תזרים חיובי מוקדם יותר.'}</p>${board}`,
  actions:[{label:'חזרה ללובי',cls:'primary'}]});
 dropSave(S);const g=S.groupId;S=null;resetWorld();openLobby(g&&ME?{k:'group',id:g}:{k:'home'})}

async function turn(){if(busy||!S||S.over)return;busy=true;$('#roll').disabled=true;$('#sheet').classList.remove('open');
 let end=null;
 try{const n=await rollDie();for(let s=0;s<n;s++){const from=S.pos;S.pos=(S.pos+1)%24;await hop(from,S.pos);if(BOARD[S.pos]==='P'&&s<n-1)payday(false)}
  const t=BOARD[S.pos];
  if(t==='P')await onPayday();else if(t==='O')await onDeal();else if(t==='D')await onDoodad();else if(t==='M')await onMarket();else await onLayoff();
  S.turn++;render();save();
  const pas=passive();if(pas>0&&pas>=expTotal())end='won';else if(S.month>MAXM&&S.mode!=='free')end='lost'}
 finally{busy=false;$('#roll').disabled=false}
 if(end)await finishGame(end);else $('#roll').focus()}
$('#roll').onclick=turn;
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&$('#modal').hidden&&$('#start').hidden&&document.activeElement===document.body){e.preventDefault();turn()}});

function resetWorld(){slotUsed.forEach((m,i)=>{if(m){scene.remove(m);slotUsed[i]=null}});mModels.stock=mModels.crypto=null;pawn.position.copy(tilePos(0))}
function begin(state,fresh){resetWorld();S=state;$('#start').hidden=true;$('#roll').disabled=false;
 pawn.position.copy(tilePos(S.pos));
 if(!fresh){S.assets.forEach(a=>a.m=spawn(MODEL_FOR[a.k]));syncMarketModels(true)}
 render();showDie(1);save();
 const goal=S.mode==='free'?'':` יש לך ${MAXM} חודשים. כולם מקבלים את אותן קוביות ואותם קלפים — מה שקובע זה ההחלטות שלך.`;
 mentor(fresh?`אתה ${S.prof}. כל חודש נכנס לך ${fmt(cashflow())} אחרי הוצאות. המטרה: נכסים שמכניסים ${fmt(expTotal())} בחודש.${goal}`:`חזרת לחודש ${S.month}. נמשיך מאיפה שעצרנו.`)}
$('#lobbyBtn').onclick=()=>{if(busy)return;save();openLobby(view)};

/* ---------------- LOBBY ---------------- */
const lobby=$('#lobby');let view={k:'home'},pendingJoin=new URLSearchParams(location.search).get('join');
function openLobby(v){$('#start').hidden=false;$('#sheet').classList.remove('open');if(v&&v.k==='group')showGroup(v.id);else showHome()}
const profCards=()=>PROFS.map((p,i)=>{const ex=p.exp.reduce((s,e)=>s+e[1],0);return`<button class="prof" data-p="${i}"><h3>${p.n}</h3>
 <div class="row"><span>משכורת</span><span>${fmt(p.salary)}</span></div><div class="row"><span>הוצאות</span><span>${fmt(ex)}</span></div><div class="row"><span>נשאר בחודש</span><b class="pos">${sgn(p.salary-ex)}</b></div><div class="row"><span>מזומן בהתחלה</span><span>${fmt(p.cash)}</span></div></button>`}).join('');

function showHome(){view={k:'home'};const free=loadSave('rr-save-free');
 lobby.innerHTML=`<div class="lh"><h1>מירוץ העכברים</h1>${ME?`<div class="who">שלום, <b>${esc(ME.nickname)}</b><button class="chip" id="renBtn">שינוי כינוי</button></div>`:''}</div>
 <p class="lead">משכורת נכנסת, הוצאות יוצאות, וחוזר חלילה. המטרה: לבנות <b>הכנסה פסיבית</b> מנכסים שעוברת את ההוצאות שלך — ולעשות את זה מהר יותר מהחברים.</p>
 ${ME?'':`<form class="namef" id="nameF"><label for="nick">${pendingJoin?'הוזמנת לקבוצה! ':''}איך יקראו לך בטבלאות?</label><div class="inl"><input id="nick" maxlength="20" placeholder="כינוי" autocomplete="nickname" required><button class="primary">יאללה</button></div><p class="err" id="nErr"></p></form>`}
 <div class="lgrid">
  <section class="lcard"><h2>האתגר השבועי</h2><div id="weekly">${ME?'<p class="note">טוען…</p>':'<p class="note">כל השחקנים, אותו מקצוע, אותן קוביות. בחר כינוי כדי להיכנס לטבלה.</p>'}</div></section>
  <section class="lcard"><h2>הקבוצות שלי</h2>${ME?`<div id="groups"><p class="note">טוען…</p></div>
   <form id="joinF" class="stack8"><label class="note" for="jcode">קיבלת קוד מחבר?</label><div class="inl"><input id="jcode" maxlength="6" placeholder="קוד קבוצה" style="direction:ltr;text-transform:uppercase"><button>להצטרף</button></div></form>
   <form id="newG" class="stack8" style="margin-top:10px"><label class="note" for="gname">או פתח קבוצה חדשה</label><div class="inl"><input id="gname" maxlength="40" placeholder="שם הקבוצה"><button class="primary">ליצור</button></div></form><p class="err" id="gErr"></p>`
   :'<p class="note">פותחים קבוצה, שולחים קישור לחברים, ומתחרים מי יוצא מהמירוץ הכי מהר.</p>'}</section>
 </div>
 <section class="lcard"><h2>משחק חופשי</h2>${free?`<button class="primary" id="contFree" style="width:100%;margin-bottom:10px">להמשיך · ${esc(free.prof)}, חודש ${free.month}</button>`:''}<p class="note" style="margin:0 0 8px">בלי טבלה ובלי לחץ. בחר מקצוע — משכורת גבוהה לא אומרת שתגיע ראשון.</p><div class="profs" id="profs">${profCards()}</div></section>
 <p class="note">המספרים במשחק מפושטים כדי שהמשחק יזרום — העקרונות אמיתיים.</p>`;
 $('#profs').onclick=e=>{const b=e.target.closest('[data-p]');if(b){if(free)dropSave(free);begin(newState(PROFS[+b.dataset.p]),true)}};
 if(free)$('#contFree').onclick=()=>begin(free,false);
 if(!ME){$('#nameF').onsubmit=async e=>{e.preventDefault();const n=$('#nick').value.trim();$('#nErr').textContent='';
   try{ME=await api('rr_register',{p_nickname:n});localStorage.setItem('rr-player',JSON.stringify(ME))}catch(err){$('#nErr').textContent=err.message;return}
   if(pendingJoin)return joinCode(pendingJoin);showHome()};return}
 $('#renBtn').onclick=async()=>{const v=await card({tag:'פרופיל',color:'#2f6fdb',title:'שינוי כינוי',html:`<input id="rn" maxlength="20" value="${esc(ME.nickname)}"><p class="err" id="rnE"></p>`,
   actions:[{label:'לשמור',cls:'primary',v:'ok',fn:()=>{const n=$('#rn').value.trim();if(n.length<2){$('#rnE').textContent='כינוי צריך להיות 2–20 תווים';return false}}},{label:'ביטול'}]});
  if(v!=='ok')return;try{const r=await api('rr_rename',{...auth(),p_nickname:$('#rn')?.value?.trim()||ME.nickname});ME.nickname=r.nickname;localStorage.setItem('rr-player',JSON.stringify(ME))}catch(e){toast(e.message)}showHome()};
 $('#joinF').onsubmit=e=>{e.preventDefault();joinCode($('#jcode').value)};
 $('#newG').onsubmit=async e=>{e.preventDefault();$('#gErr').textContent='';try{const g=await api('rr_create_group',{...auth(),p_name:$('#gname').value});showGroup(g.id)}catch(err){$('#gErr').textContent=err.message}};
 loadWeekly();loadGroups();
 if(pendingJoin)joinCode(pendingJoin)}

async function joinCode(code){pendingJoin=null;history.replaceState(null,'',location.pathname);
 try{const g=await api('rr_join_group',{...auth(),p_code:code});toast('הצטרפת ל'+g.name);showGroup(g.id)}catch(e){showHome();setTimeout(()=>{const el=$('#gErr');if(el)el.textContent=e.message},0)}}

async function loadWeekly(){const box=$('#weekly');try{const w=await api('rr_weekly',auth());if(!box.isConnected)return;
 box.innerHTML=`<p class="meta">מקצוע השבוע: <b>${PNAME[w.profession]}</b> · ${daysLeft(w.ends_at)}</p>
  ${w.my_status==='won'||w.my_status==='lost'?'<p class="note">סיימת את האתגר השבוע. נתראה בשבוע הבא.</p>':`<button class="primary" id="playW" style="width:100%">${w.my_status==='playing'?'להמשיך את האתגר':'להתחיל את האתגר'}</button>`}
  ${boardHtml(w.board,10)}`;
 $('#playW')&&($('#playW').onclick=()=>playRanked({weekly:true,title:'אתגר שבועי'}))}catch(e){if(box.isConnected)box.innerHTML=`<p class="err">${esc(e.message)}</p>`}}

async function loadGroups(){const box=$('#groups');try{const gs=await api('rr_my_groups',auth());if(!box.isConnected)return;
 box.innerHTML=gs.length?`<div class="glist">${gs.map(g=>`<button class="gitem" data-g="${g.id}"><span><b>${esc(g.name)}</b><br><small>${g.members===1?'שחקן אחד':g.members+' שחקנים'}${g.active?` · ${g.active} אתגרים פעילים`:''}</small></span><span aria-hidden="true">‹</span></button>`).join('')}</div>`:'<p class="empty">עוד אין לך קבוצות.</p>';
 box.onclick=e=>{const b=e.target.closest('[data-g]');if(b)showGroup(b.dataset.g)}}catch(e){if(box.isConnected)box.innerHTML=`<p class="err">${esc(e.message)}</p>`}}

async function showGroup(id){view={k:'group',id};if(!ME)return showHome();lobby.innerHTML='<p class="note">טוען את הקבוצה…</p>';let g;
 try{g=await api('rr_group',{...auth(),p_group:id})}catch(e){view={k:'home'};showHome();toast(e.message);return}
 const link=`${location.origin}${location.pathname}?join=${g.code}`;
 lobby.innerHTML=`<div class="lh"><button class="chip" id="back">› חזרה</button><button class="chip" id="refresh">רענון</button></div>
 <h1 style="margin-top:10px">${esc(g.name)}</h1>
 <div class="lgrid">
  <section class="lcard"><h2>הזמנת חברים</h2><p class="meta">שלח את הקישור, או תן להם את הקוד:</p><div class="code">${g.code}</div>
   <div class="inl" style="margin-top:10px"><input id="lnk" value="${esc(link)}" readonly style="direction:ltr"><button class="primary" id="copy">להעתיק קישור</button></div>
   <h3 class="meta" style="margin-top:14px">${g.members.length===1?'שחקן אחד — שלח את הקישור לחברים':g.members.length+' שחקנים'}</h3><div class="members">${g.members.map(m=>`<span>${esc(m.nickname)}${m.owner?' · מנהל':''}</span>`).join('')}</div></section>
  <section class="lcard"><h2>אתגר חדש</h2><p class="meta">כל מי שבקבוצה משחק עם אותו מקצוע, אותן קוביות ואותם קלפים. מנצח מי שיוצא מהמירוץ בפחות חודשים.</p>
   <form id="newC"><input id="ct" maxlength="50" placeholder="שם האתגר (למשל: מי יוצא ראשון?)"><div class="cf">
    <select id="cp" aria-label="מקצוע">${PROFS.map(p=>`<option value="${p.id}">${p.n}</option>`).join('')}</select>
    <select id="cd" aria-label="משך">${[[1,'יום'],[3,'3 ימים'],[7,'שבוע'],[14,'שבועיים']].map(([d,l])=>`<option value="${d}" ${d===7?'selected':''}>${l}</option>`).join('')}</select>
    <button class="primary">לפתוח</button></div></form><p class="err" id="cErr"></p></section>
 </div>
 <section class="lcard"><h2>אתגרים</h2>${g.challenges.length?g.challenges.map(c=>`<div class="chal"><h3>${esc(c.title)}</h3>
   <p class="meta">${PNAME[c.profession]} · ${c.active?daysLeft(c.ends_at):'נסגר'}</p>
   ${c.active&&c.my_status!=='won'&&c.my_status!=='lost'?`<button class="primary" data-play="${c.id}" data-t="${esc(c.title)}">${c.my_status==='playing'?'להמשיך':'לשחק'}</button>`:c.my_status?'<p class="note">סיימת את האתגר הזה.</p>':''}
   ${boardHtml(c.board,15)}</div>`).join(''):'<p class="empty">אין עדיין אתגרים. פתח את הראשון.</p>'}</section>
 <p style="margin-top:14px"><button class="chip" id="leave">לעזוב את הקבוצה</button></p>`;
 $('#back').onclick=showHome;$('#refresh').onclick=()=>showGroup(id);
 $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('הקישור הועתק')}catch(e){$('#lnk').select();toast('סמן והעתק את הקישור')}};
 $('#newC').onsubmit=async e=>{e.preventDefault();$('#cErr').textContent='';try{await api('rr_create_challenge',{...auth(),p_group:id,p_title:$('#ct').value,p_profession:$('#cp').value,p_days:+$('#cd').value});showGroup(id)}catch(err){$('#cErr').textContent=err.message}};
 lobby.onclick=e=>{const b=e.target.closest('[data-play]');if(b)playRanked({challenge:b.dataset.play,groupId:id,title:b.dataset.t})};
 let sure=false;$('#leave').onclick=async e=>{if(!sure){sure=true;e.target.textContent='בטוח? לחץ שוב כדי לעזוב';return}try{await api('rr_leave_group',{...auth(),p_group:id});showHome()}catch(err){toast(err.message)}}}

async function playRanked(o){let r;try{r=await api('rr_start',{...auth(),p_challenge:o.challenge||null,p_weekly:!!o.weekly})}catch(e){toast(e.message);return}
 if(r.status!=='playing'){toast('כבר סיימת את המשחק הזה');return}
 const sv=loadSave('rr-save-'+r.result_id);if(sv)return begin(sv,false);
 const p=PROFS.find(x=>x.id===r.profession);
 begin(newState(p,{mode:o.weekly?'weekly':'challenge',seed:Number(r.seed),resultId:r.result_id,challengeId:o.challenge||null,groupId:o.groupId||null,title:o.title}),true)}

buildWorld().then(()=>{$('#loading').hidden=true;openLobby()}).catch(err=>{$('#loading').textContent='משהו נכשל בטעינה: '+err.message;console.error(err)});
}
</script>
</body>
</html>
